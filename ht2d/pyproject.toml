[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ht2d"
version = "0.1.0"
description = "Hypothesis Test Drift Detection — modular detectors, distributions, and model adapters."
readme = "README.md"
requires-python = ">=3.9"
authors = [{name="Malchiodi"}]
license = {text = "UNIMI"}
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9"
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6.0", "mypy>=1.0"]
river = ["river>=0.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ht2d = ["py.typed"]

[tool.ruff]
line-length = 100
